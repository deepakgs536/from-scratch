name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      function_name:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      AWS_REGION:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.service }}-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'  
          
      - name: Install Production Dependencies
        run: npm ci --omit=dev --ignore-scripts
        
      - name: Zip Deployment Package
        run: zip -r deploy.zip .
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Deploy to AWS Lambda
        run: aws lambda update-function-code --function-name ${{ inputs.function_name }} --zip-file fileb://deploy.zip
