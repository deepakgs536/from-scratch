name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter-backend.outputs.changes }}
      frontend: ${{ steps.filter-frontend.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
        id: filter-backend
        with:
          filters: |
            product:
              - 'product-service/**'
            inventory:
              - 'inventory-service/**'
            cart:
              - 'cart-service/**'
            order:
              - 'order-service/**'
            payment:
              - 'payment-service/**'
            user:
              - 'user-service/**'
            auth:
              - 'auth-service/**'
            media:
              - 'media-service/**'
            analytics:
              - 'analytics-service/**'
            notification:
              - 'notification-service/**'
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
        id: filter-frontend
        with:
          filters: |
            frontend:
              - 'ecommerce-frontend/**'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      service: ${{ matrix.service }}

  security-dependencies:
    needs: changes
    uses: ./.github/workflows/reusable-snyk-sca.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_ACCESS_TOKEN }}

  security-sast:
    needs: changes
    uses: ./.github/workflows/reusable-snyk-sast.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_ACCESS_TOKEN }}

  security-sonarqube:
    needs: changes
    uses: ./.github/workflows/reusable-sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  infra-validate:
    needs: changes
    uses: ./.github/workflows/reusable-infra.yml

  deploy:
    needs: [changes, test, security-dependencies, security-sast, security-sonarqube, infra-validate]
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service: ${{ matrix.service }}
      function_name: lambda-dev-ecommerce-${{ matrix.service }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

  deploy-frontend:
    needs: [changes, infra-validate]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ecommerce-frontend
        run: npm ci
      - name: Build
        working-directory: ecommerce-frontend
        run: npm run build
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to S3
        run: aws s3 sync ecommerce-frontend/dist/ s3://deepak-ecommerce-frontend --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E18RN7YW6NF1CA --paths "/*"