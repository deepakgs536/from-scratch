name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            product:
              - 'product-service/**'
            inventory:
              - 'inventory-service/**'
            cart:
              - 'cart-service/**'
            order:
              - 'order-service/**'
            payment:
              - 'payment-service/**'
            user:
              - 'user-service/**'
            auth:
              - 'auth-service/**'
            media:
              - 'media-service/**'
            analytics:
              - 'analytics-service/**'
            notification:
              - 'notification-service/**'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      service: ${{ matrix.service }}

  security-dependencies:
    uses: ./.github/workflows/reusable-snyk-sca.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_ACCESS_TOKEN }}

  security-sast:
    uses: ./.github/workflows/reusable-snyk-sast.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_ACCESS_TOKEN }}

  infra-validate:
    uses: ./.github/workflows/reusable-infra.yml

  deploy:
    needs: [changes, test, security-dependencies, security-sast, infra-validate]
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service: ${{ matrix.service }}
      # Conditional logic: product maps to dk-ps-v2, others map to Terraform generated names
      function_name: ${{ matrix.service == 'product' && 'dk-ps-v2' || format('lambda-dev-ecommerce-{0}', matrix.service) }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}