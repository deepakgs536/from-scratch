name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.filter.outputs.product }}
      inventory: ${{ steps.filter.outputs.inventory }}
      cart: ${{ steps.filter.outputs.cart }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      user: ${{ steps.filter.outputs.user }}
      auth: ${{ steps.filter.outputs.auth }}
      media: ${{ steps.filter.outputs.media }}
      analytics: ${{ steps.filter.outputs.analytics }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            product:
              - 'product-service/**'
            inventory:
              - 'inventory-service/**'
            cart:
              - 'cart-service/**'
            order:
              - 'order-service/**'
            payment:
              - 'payment-service/**'
            user:
              - 'user-service/**'
            auth:
              - 'auth-service/**'
            media:
              - 'media-service/**'
            analytics:
              - 'analytics-service/**'
            notification:
              - 'notification-service/**'

  test-product-service:
    needs: changes
    if: ${{ needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./product-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-inventory-service:
    needs: changes
    if: ${{ needs.changes.outputs.inventory == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-cart-service:
    needs: changes
    if: ${{ needs.changes.outputs.cart == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cart-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-order-service:
    needs: changes
    if: ${{ needs.changes.outputs.order == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./order-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-payment-service:
    needs: changes
    if: ${{ needs.changes.outputs.payment == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-user-service:
    needs: changes
    if: ${{ needs.changes.outputs.user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./user-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-auth-service:
    needs: changes
    if: ${{ needs.changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  test-media-service:
    needs: changes
    if: ${{ needs.changes.outputs.media == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./media-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
