  test-notification-service:
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./notification-service
    
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_ACCESS_TOKEN }}
        with:
          args: --all-projects --json-file-output=snyk-report.json
        continue-on-error: true
      - name: Echo Detailed Snyk Report
        run: |
          echo "Here is the detailed Snyk security report:"
          cat snyk-report.json