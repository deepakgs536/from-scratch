name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.service }}-service
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Fix lcov paths for SonarQube
        if: always()
        run: sed -i "s|^SF:|SF:${{ inputs.service }}-service/|g" ./${{ inputs.service }}-service/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.service }}
          path: ./${{ inputs.service }}-service/lcov.info
          retention-days: 1
